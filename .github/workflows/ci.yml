name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [upstream-changed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  notify-downstream:
    name: Notify downstream
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [pi-agent-swift, pi-kit-swift, macos-ai-assistant]
    steps:
      - name: Dispatch ${{ matrix.repo }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH_TOKEN not set; skipping dispatch to ${{ matrix.repo }}"
            exit 0
          fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/quyansiyuanwang/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"upstream-changed"}'
